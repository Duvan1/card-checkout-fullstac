name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ main, develop, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 🚀 NUEVO PASO: Fuerza el despliegue automático en ECS Fargate
      - name: Force ECS Redeployment
        run: |
          # Obtiene dinámicamente el ARN/nombre del servicio dentro de CardCheckoutCluster
          SERVICE_NAME=$(aws ecs list-services --cluster CardCheckoutCluster --query "serviceArns[0]" --output text)
          
          echo "Desplegando en el servicio: $SERVICE_NAME"
          
          aws ecs update-service \
            --cluster CardCheckoutCluster \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}