name: Deploy Frontend to AWS S3 & CloudFront

on:
  push:
    branches: [ main, develop, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm run build

      - name: Verify build output
        run: |
          echo "===== Valor esperado ====="
          echo $VITE_API_URL

          echo ""
          echo "===== Buscar URL del ALB ====="
          grep -R "elb.amazonaws.com" frontend/dist || true

          echo ""
          echo "===== Buscar localhost ====="
          grep -R "localhost:3000" frontend/dist || true

          echo ""
          echo "===== Buscar /api ====="
          grep -R "/api" frontend/dist || true

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Obtener dinámicamente el nombre del bucket de S3 usando la CLI
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          
          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete

      - name: List uploaded files
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)

          aws s3 ls s3://$BUCKET_NAME/assets/

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name InfraStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text)

          echo "Distribution ID: $DISTRIBUTION_ID"

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"