name: Deploy Frontend to AWS S3 & CloudFront

on:
  push:
    branches: [ main, develop, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: http://InfraS-Backe-z4F2NhbNlmvg-191550612.us-east-1.elb.amazonaws.com
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Obtener dinámicamente el nombre del bucket de S3 usando la CLI
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          
          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete

      - name: Invalidate CloudFront Cache
        run: |
          # Obtener el ID de la distribución de CloudFront
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name InfraStack --query "Stacks[0].Outputs[?contains(OutputKey, 'FrontendDistribution')].OutputValue" --output text)
          
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"